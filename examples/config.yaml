poll:
  active_after: 5m
  idle_after: 60m
  capture_lines: 120
  ssh_timeout: 5s
  command_timeout: 15s

tui:
  sort:
    # attention | last-output | state | id
    field: attention
    # asc | desc
    direction: desc

hosts:
  - id: local
    type: local
    # Optional roots used by the TUI session directory picker.
    session_roots:
      - ~/code
      - ~/work
    # Optional: inspect a non-default tmux server socket for this host.
    # tmux_socket: ~/.work-os/tmux.sock

  - id: pi
    type: ssh
    # Optional roots are evaluated on the remote host.
    session_roots:
      - /home/cam
    # Optional for SSH hosts too; the path is evaluated on the remote host.
    # tmux_socket: ~/.work-os/tmux.sock
    ssh:
      target: cam@192.168.0.197
      # Optional escape hatch for environments with broken system SSH config.
      # Omit this to reuse normal ~/.ssh/config behavior.
      config_file: /dev/null
      options:
        BatchMode: "yes"
        ConnectTimeout: "5"

session_templates:
  presets:
    - id: client
      label: Client Work
      prefix: client
    - id: ops
      label: Operations
      prefix: ops

watches:
  - id: local-shell
    host: local
    match:
      tmux:
        session: remux-local
        window: 0
        pane: 0
    repo: ~/code/remux
    agent_hint: shell

  - id: pi-agent
    host: pi
    match:
      command: node
      cwd_prefix: /home/cam/openclaw
    repo: /home/cam/openclaw
    agent_hint: codex
