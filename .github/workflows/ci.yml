name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch Dependencies
        run: cargo fetch --locked

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --locked --all-targets --all-features

      - name: Build Release
        run: cargo build --release --locked

      - name: Check CLI Help
        run: cargo run --locked -- --help

      - name: Check Fixture Config
        run: cargo run --locked -- --config fixtures/config/pi.yaml hosts

      - name: Check Validation Errors
        run: |
          ! cargo run --locked -- --config fixtures/config/duplicate-host.yaml hosts
          ! cargo run --locked -- --config fixtures/config/duplicate-session.yaml hosts
          ! cargo run --locked -- --config fixtures/config/missing-host-ref.yaml hosts
          ! cargo run --locked -- --config fixtures/config/invalid-duration.yaml hosts
