name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: x86_64-linux
            binary_name: remux
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_suffix: aarch64-linux
            binary_name: remux
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive_suffix: aarch64-macos
            binary_name: remux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PACKAGE_DIR="remux-${VERSION}-${{ matrix.archive_suffix }}"
          mkdir -p dist/${PACKAGE_DIR}
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${PACKAGE_DIR}/
          cp README.md dist/${PACKAGE_DIR}/
          tar -C dist -czf dist/${PACKAGE_DIR}.tar.gz ${PACKAGE_DIR}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/${PACKAGE_DIR}.tar.gz > dist/${PACKAGE_DIR}.tar.gz.sha256
          else
            shasum -a 256 dist/${PACKAGE_DIR}.tar.gz > dist/${PACKAGE_DIR}.tar.gz.sha256
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remux-${{ matrix.archive_suffix }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksum file
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: true
